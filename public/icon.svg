<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="#334155" stroke-width="6"/>

  <!-- Shield Outline -->
  <path d="M256 72 L384 128 C384 272 256 384 256 424 C256 384 128 272 128 128 Z" 
        fill="#0f172a" stroke="url(#shieldGrad)" stroke-width="16" stroke-linejoin="round"/>

  <!-- Inner Circuit Grid Accent -->
  <circle cx="256" cy="248" r="100" fill="none" stroke="#1e293b" stroke-width="4" stroke-dasharray="12 8"/>
  <circle cx="256" cy="248" r="70" fill="none" stroke="#334155" stroke-width="3"/>

  <!-- EDM Discharge Lightning Spark -->
  <path d="M272 136 L216 248 L264 248 L240 360 L320 224 L272 224 Z" 
        fill="url(#sparkGrad)" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>

  <!-- Glow Dot -->
  <circle cx="256" cy="424" r="10" fill="#f59e0b"/>
</svg>
